server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/v1/auth/ {
        resolver 10.96.0.10 valid=30s;
        set $upstream_user_app http://user-app.default.svc.cluster.local:8000;
        
        proxy_pass $upstream_user_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/users/ {
        resolver 10.96.0.10 valid=30s;
        set $upstream_user_app http://user-app.default.svc.cluster.local:8000;
        
        proxy_pass $upstream_user_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/posts/ {
        resolver 10.96.0.10 valid=30s;
        set $upstream_innotter_api http://innotter-api.default.svc.cluster.local:8002;
        proxy_pass $upstream_innotter_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/resizer/ {
        resolver 10.96.0.10 valid=30s;
        set $upstream_resizer_app http://resizer-service.default.svc.cluster.local:8000;
        
        rewrite ^/api/v1/resizer/(.*) /$1 break;

        proxy_pass $upstream_resizer_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }


    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }
}