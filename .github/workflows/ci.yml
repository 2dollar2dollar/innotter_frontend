name: CI Pipeline

on:
  push:
    branches: [ "main", "dev", "auth-flow" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Run Linter
      run: npm run lint

    - name: Run Tests
      run: npm test
      env:
        CI: true

    - name: Build Application
      run: npm run build

    - name: Build Docker Image
      run: docker build -t innotter-frontend-test .
