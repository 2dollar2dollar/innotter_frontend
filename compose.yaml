services:
  frontend:
    build:
      context: .
      target: development
    ports:
      - "3000:3000"
    env_file: .env
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - default

  storybook:
    build:
      context: .
      target: development
    command: npm run storybook
    ports:
      - "6006:6006"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - default

networks:
  default:
    external: true
    name: microservices_net